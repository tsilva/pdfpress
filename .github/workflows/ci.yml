name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  merge_group:
    types:
      - checks_requested

permissions:
  contents: read

jobs:
  test:
    name: Python security and regression gates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.2.0
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: 0.11.13
          cache: true

      - name: Install locked dependencies
        run: uv sync --frozen --all-extras

      - name: Audit locked dependencies
        run: uv audit

      - name: Lint
        run: uv run --frozen ruff check .

      - name: Type-check
        run: uv run --frozen mypy src

      - name: Test security boundaries and application behavior
        run: uv run --frozen pytest

      - name: Build package
        run: uv build

      - name: Smoke-test CLI
        run: uv run --frozen pdfpress --version
